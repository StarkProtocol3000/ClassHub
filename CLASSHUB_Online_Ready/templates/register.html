{% extends "base.html" %}{% block title %}Student sign up · CLASSHUB{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">JOIN YOUR CLASS</span><h1>Create student account</h1><p class="muted">Ask your lecturer for the class code before signing up.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" required minlength="2" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password <small>(at least 8 characters)</small><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Class code<input name="class_code" required placeholder="e.g. CSE-A-2026" autocapitalize="characters"></label><button class="btn primary full">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
