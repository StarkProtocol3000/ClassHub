services:
  - type: web
    name: classhub
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLASSHUB_SECRET
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
